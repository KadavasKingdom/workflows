name: Publish Package

on:
  workflow_call:
    secrets:
      gh_token:
        required: true

permissions:
  contents: write
  packages: write
  
jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Download SCP:SL References
      uses: Axwabo/scpsl-references-downloader@v1
      id: refs

    - name: Add GitHub NuGet Source
      run: dotnet nuget add source https://nuget.pkg.github.com/KadavasKingdom/index.json --name "github" --username "any" --password ${{ secrets.gh_token }} --store-password-in-clear-text

    - name: Build
      run: dotnet build -c:Release -o Out
      env:
        ReferencePath: ${{ steps.refs.outputs.target }}

    - name : Upload Package
      uses: actions/upload-artifact@v7
      with:
        name: Package
        path: Out/**.nupkg

    - name: Release Package
      uses: softprops/action-gh-release@v3
      with:
        files: Out/**.nupkg

    - name: Publish to GitHub Packages
      run: dotnet nuget push Out/**.nupkg --source "github" --api-key ${{ secrets.gh_token }}
